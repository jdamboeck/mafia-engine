# Terminal-specific rendering layout.
# This file lives in the client, not the theme — box-drawing chars and Unicode
# symbols are terminal-specific and would not apply to pygame/web clients.

map:
  # Background: light grey (original C64 $D021=15, Pepto #b2b2b2)
  bg_color: light_grey
  # Player: red @ (static, no blink)
  player_char: "@"
  # Door characters and colors (per-location Unicode symbols)
  door_chars:
    slw: { char: "\u25c2", color: white }      # ◂ left triangle
    pub: { char: "\u25b8", color: light_green } # ▸ right triangle
    sph: { char: "\u25aa", color: yellow }      # ▪ small square
    waf: { char: "\u25b4", color: light_red }   # ▴ up triangle
    ble: { char: "\u25be", color: cyan }        # ▾ down triangle
    pol: { char: "\u25c6", color: light_blue }  # ◆ diamond
    aut: { char: "\u25cf", color: purple }      # ● filled circle
    sgl: { char: "\u25a3", color: brown }       # ▣ square in a square
    sub: { char: "\u25a4", color: green }       # ▤ square with horizontal fill
    bhf: { char: "\u25a6", color: dark_grey }   # ▦ square with crosshatch fill
    ban: { char: "\u25c8", color: light_brown } # ◈ diamond in a diamond
  # Special cells (dynamic event markers)
  special_cells:
    569: { char: "\u25cc", color: blue }   # ◌ transport
    861: { char: "\u265b", color: red }     # ♛ mayor
