[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mafia-engine"
version = "0.0.0"
description = "A genre engine (turn-based board-game strategy with tactical combat), with the 1986 'Mafia' as its reference title."
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff==0.16.8",
]

[tool.setuptools.packages.find]
include = ["engine*", "clients*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py311"
line-length = 100
# Keep the formatter off Markdown: ruff >=0.16 also formats Python code blocks
# inside .md files, which would rewrite plans and solution docs.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# Explicit rule set, so a ruff upgrade that widens its defaults cannot turn the
# hard lint gate red on unchanged code.
select = ["E4", "E7", "E9", "F"]
