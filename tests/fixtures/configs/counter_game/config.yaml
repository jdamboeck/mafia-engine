# counter_game — a test-only game config that exercises the effect and state
# registries (tests/test_effect_registry.py). It is not a playable game.
engine_api: 1
name: "counter_game"

entities: {}
formula_params: {}
setup: {}
input_ranges: {}

# The declared value maps: names, types and defaults.
state:
  player:
    counter: {type: int, default: 0}
    label: {type: str, default: "none"}
  global:
    round_bonus: {type: float, default: 0.0}
