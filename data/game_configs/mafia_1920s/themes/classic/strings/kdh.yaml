# kdh (Kredit-Hai / loan shark) — classic-theme strings (VERBATIM German).
#
# DATA, not code: the engine emits KEYS (e.g. "locations.kdh.borrow_prompt")
# and the theme resolves them to these strings. Ported from the research
# (research-data/pass-2/location-dialogue.yaml, mf-prg.bas:15000-15321) — verbatim.
locations:
  kdh:
    # :3025 the title from the location's disk file, printed in reverse video
    # above the description (verbatim from location-dialogue.yaml).
    title: "KREDIT-HAI"
    entry_prompt: "'EIN WUNDERSCHOENEN GUTEN TAG, KANN     ICH IHNEN HELFEN?'"
    menu:
      borrow: "'JA. ICH BRAUCHE EIN BISSCHEN KNETE!'"
      repay: "'NEIN, NEIN! ICH WILL NUR MEINE SCHUL-  DEN ABZAHLEN!'"
      trade: "LADEN AUFKAUFEN BZW. VERKAUFEN"
      capital: "KAPITAL IM LADEN AENDERN (BEI EIGENEM   KREDITGESCHAEFT)"
      collect: "UEBERFAELLIGE SCHULDEN EINTREIBEN (BEI  EIGENEM GESCHAEFT)"
      leave: "'ICH HELFE MIR SELBST.'"

    # --- borrow (15010-15030) ---
    pay_old_debts_first: "'zahle erstmal deine alten schulden ab!'"  # :15010 `zahle erstmal deine alten schulden ab!`
    borrow_prompt: "wieviel geld willst du leihen (0-5000 $)"  # :15015 `wieviel geld willst du leihen`
    borrow_grace_notice: "'du hast 6 monate zeit, die schulden zurueck zu zahlen!'"  # :15025-15026 `du hast 6 monate zeit, die schulden`

    # --- repay (15050-15075) ---
    repay_prompt: "wieviel willst du zurueckzahlen"  # :15050 `wieviel willst du zurueckzahlen`
    repay_partial: "'ok, du hast jetzt noch{remaining}$ schulden!'"  # :15070 `ok, du hast jetzt noch`
    repay_full: "'du hast die schulden zurueckgezahlt!'"  # :15075 `du hast die schulden zurueckgezahlt!`

    # --- trade: buy/sell the loan business (15100-15155) ---
    already_own_a_shop: "'du hast schon ein kreditgeschaeft!'"  # :15105 `du hast schon ein kreditgeschaeft!`
    pay_own_debts_first: "'zahle erstmal deine eigenen schulden!'"  # :15106 `zahle erstmal deine eigenen schulden!`
    shop_belongs_to: "'der laden gehoert {name}!'"  # :15108 `der laden gehoert "sp$(i)"!`
    buy_offer: "'der jetzige besitzer verlangt{price}$.'"  # :15110 `der jetzige besitzer verlangt`
    buy_confirm: "ok (j/n)?"
    bought: "'der laden gehoert nun dir!'"  # :15120 `der laden gehoert nun dir!`
    sell_offer: "'ein kaeufer bietet dir{price}$ fuer den laden. willst du verkaufen (j/n) ?'"  # :15150-15151 `ein kaeufer bietet dir`
    sell_confirm: "ok (j/n)?"

    # --- capital adjust (15200-15220) ---
    not_your_shop: "'dieser laden gehoert dir nicht!'"  # :15200/15300 `dieser laden gehoert dir nicht!`
    capital_status: "'du hast{capital}$ im kreditgeschaeft (maximal {max:mid$} $).'"  # :15205 `im kreditgeschaeft`
    capital_prompt: "um wieviel dollar (- oder +) willst du das geldvolumen erhoehen bzw. verringern"  # :15206-15208 `um wieviel dollar (- oder +) willst du`

    # --- collect overdue debts (15300-15321) ---
    debts_paid_on_time: "'alle schuldner haben puenktlich gezahlt!'"  # :15306 `alle schuldner haben puenktlich ge-`
    ambush_intro: "'einer deiner klienten hat noch geld. er lauert dir mit einem gewehr auf, als du kassieren willst!'"  # :15310-15311 `einer deiner klienten hat noch geld. er`
    ambush_loot: "'er hatte noch{amount}$ dabei!'"  # :15321 `er hatte noch`
