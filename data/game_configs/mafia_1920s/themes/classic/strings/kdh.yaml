# kdh (Kredit-Hai / loan shark) — classic-theme strings (VERBATIM German).
#
# DATA, not code: the engine emits KEYS (e.g. "locations.kdh.borrow_prompt")
# and the theme resolves them to these strings. Ported from the research
# (research-data/pass-2/location-dialogue.yaml, mf-prg.bas:15000-15321) — verbatim.
locations:
  kdh:
    # :3025 the title from the location's disk file, printed in reverse video
    # above the description (verbatim from location-dialogue.yaml).
    title: "Kredit-Hai"
    entry_prompt: "'Ein wunderschönen guten Tag, kann ich Ihnen helfen?'"
    menu:
      borrow: "'Ja. Ich brauche ein bisschen Knete!'"
      repay: "'Nein, nein! Ich will nur meine Schulden abzahlen!'"
      trade: "Laden aufkaufen bzw. verkaufen"
      capital: "Kapital im Laden ändern (bei eigenem Kreditgeschäft)"
      collect: "Überfällige Schulden eintreiben (bei eigenem Geschäft)"
      leave: "'Ich helfe mir selbst.'"

    # --- borrow (15010-15030) ---
    pay_old_debts_first: "Zahle erstmal deine alten Schulden ab!"  # :15010 `zahle erstmal deine alten schulden ab!`
    borrow_prompt: "Wie viel Geld willst du leihen (0-5000 $)"  # :15015 `wieviel geld willst du leihen`
    # :15021 `ifx<0orx>5000thenprint"{clr}":goto15015`: an amount off the range asks
    # again (the source on a cleared screen, the client under the last answer).
    borrow_grace_notice: "Du hast 6 Monate Zeit, die Schulden zurückzuzahlen!"  # :15025-15026 `du hast 6 monate zeit, die schulden`

    # --- repay (15050-15075) ---
    repay_prompt: "Wie viel willst du zurückzahlen"  # :15050 `wieviel willst du zurueckzahlen`
    # :15051 `inputx$` reads the answer; the range it prints first,
    # `"{down}(0-"mid$(str$(kr(sp)),2)")"`, is not in this text.
    # :15055 `ifx<0orx>kr(sp)thenprint"{clr}":goto15050`: an amount off the range asks
    # again (the source on a cleared screen, the client under the last answer).
    repay_partial: "OK, du hast jetzt noch{remaining}$ Schulden!"  # :15070 `ok, du hast jetzt noch`
    repay_full: "Du hast die Schulden zurückgezahlt!"  # :15075 `du hast die schulden zurueckgezahlt!`

    # --- trade: buy/sell the loan business (15100-15155) ---
    already_own_a_shop: "Du hast schon ein Kreditgeschäft!"  # :15105 `du hast schon ein kreditgeschaeft!`
    pay_own_debts_first: "Zahle erstmal deine eigenen Schulden!"  # :15106 `zahle erstmal deine eigenen schulden!`
    shop_belongs_to: "Der Laden gehört {name}!"  # :15108 `der laden gehoert "sp$(i)"!`
    buy_offer: "Der jetzige Besitzer verlangt{price}$."  # :15110 `der jetzige besitzer verlangt`
    # :15111 `print:gosub1110`: a blank row (the client draws none), then :1110's question.
    buy_confirm: "OK (j/n)?"
    bought: "Der Laden gehört nun dir!"  # :15120 `der laden gehoert nun dir!`
    sell_offer: "Ein Käufer bietet dir{price}$ für den Laden. Willst du verkaufen (j/n) ?"  # :15150-15151 `ein kaeufer bietet dir`
    sell_confirm: "OK (j/n)?"

    # --- capital adjust (15200-15220) ---
    not_your_shop: "Dieser Laden gehört dir nicht!"  # :15200/15300 `dieser laden gehoert dir nicht!`
    capital_status: "Du hast{capital}$ im Kreditgeschäft (maximal {max:mid$} $)."  # :15205 `im kreditgeschaeft`
    capital_prompt: "Um wie viel Dollar (- oder +) willst du das Geldvolumen erhöhen bzw. verringern"  # :15206-15208 `um wieviel dollar (- oder +) willst du`

    # --- collect overdue debts (15300-15321) ---
    debts_paid_on_time: "Alle Schuldner haben pünktlich gezahlt!"  # :15306 `alle schuldner haben puenktlich ge-`
    ambush_intro: "Einer deiner Klienten hat noch Geld. Er lauert dir mit einem Gewehr auf, als du kassieren willst!"  # :15310-15311 `einer deiner klienten hat noch geld. er`
    ambush_loot: "Er hatte noch{amount}$ dabei!"  # :15321 `er hatte noch`
