# combat (grid fight) — classic-theme strings (VERBATIM German).
#
# DATA, not code: engine/combat.py and the CombatScreen driver loop emit
# short message KEYS (see engine/fight_loop.py:_drive_fight's `message` values and
# CombatFight.shoot's result dict); the terminal client resolves them here. Ported
# byte-for-byte from research-data/pass-1/game-text.yaml + mf-prg.bas:30100-30520.
# {name}/{side}/{losses1}/{losses2} are template params the renderer fills.
combat:
  # :30025 print"{rvon}der kampf beginnt..." -- the first screen's message (the engine's
  # `begins` key), shown once before the first activation.
  begins: "der kampf beginnt..."  # :30025 `der kampf beginnt...`

  # :30015 poke211,-20*(i=2):poke214,16:syscs:printbn$(ks(i)) -- each side's name
  # under the board, side 1's at column 0 and side 2's at column 20; it stays all fight.
  side_names: "{name1}{tab(20)}{name2}"  # :30015 `printbn$(ks(i))`

  # :30400 poke211,20:poke214,18:syscs:print"{rvon}spieler"f -- the last CPU fighter's
  # number at column 20 (PRINT's sign space and trailing space around it).
  cpu_label: "{tab(20)}spieler{fighter}"  # :30400 `print"{rvon}spieler"f`

  # 30125/30139: unrecognized key falls back to the GET wait -- re-prompt, no text
  # printed by the original at that exact point; the client still needs SOME line.
  unknown_action: "?"

  # 30145: illegal move target (occupied/scenery/out of bounds) -- re-prompt.
  illegal_move: "(das geht nicht)"

  # :30235 "{rvon}verfehlt!" -- the shot missed.
  miss: "verfehlt!"

  # :30305 "treffer! spieler <i> ist am ende!" -- a player-side fighter is knocked out.
  hit_player_down: "treffer! spieler{index}ist am ende!"

  # :30300 "der gegner ist tot!" -- an enemy/NPC fighter is knocked out.
  hit_enemy_down: "der gegner ist tot!"

  # :30350 "treffer! energie -"mid$(str$(y),2)"!" -- a hit that does not knock the
  # target down, with the damage y it did.
  hit: "treffer! energie -{damage:mid$}!"

  # 30500: "{rvon} sieger: <gang>!!!" -- the winner banner. {name} = winning side's name.
  winner_banner: "sieger: {name}!!!"

  # 30510/30515: "verluste der spieler:" heading + bn$(ks(i))":"v(i) per side
  # (the count PRINTs with its sign space: "<gang>: <n> ").
  losses_heading: "verluste der spieler:"
  losses_line: "{name}:{count}"

  # The fighter panel (:30116 gosub1300): the name, then :1315's stat line, then
  # :1320's weapon. :1315 prints the ge$ fields that :1365-1385 build: each stat is
  # mid$(str$(..),2), padded to two digits with a leading "0" ("e05 k10 i07 b03").
  # `panel_stats` is filled with the engine's `vitality` SLOT and the fighter's
  # opaque `attrs`, so this game's stat names live here, not in the client.
  panel_stats: "e{vitality:mid$0>2} k{kraft:mid$0>2} i{intelligenz:mid$0>2} b{brutalitaet:mid$0>2}"
  # :1320 print"w:"wa$(gw(a,b))
  panel_weapon: "w:{weapon}"

  # Action prompt shown above the key legend.
  action_prompt: "deine aktion:"

  # Key legend -- presentation-only (key bindings are presentation, not
  # ported source text), shown once per activation above the input line.
  key_legend: "[wasd] bewegen  [f]+[wasd] schiessen  [p] aussetzen  'surrender' aufgeben"

  # Opt-in observation frame (--watch-ai) -- presentation-only: the original
  # narrates nothing between CPU activations (mf-prg.bas:30110), so this line exists
  # only for a viewer who opted in. Shown under the board after each CPU activation.
  observe_prompt: "gegner am zug -- [enter] weiter"
