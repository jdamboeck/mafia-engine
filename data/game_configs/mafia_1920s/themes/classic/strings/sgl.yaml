# sgl (Einfacher Laden, the protection racket) — classic-theme strings (VERBATIM German).
#
# DATA, not code: handlers/sgl.py emits these KEYS and the theme resolves them. The menu
# is the SEQ file src/sgl (research-data/pass-2/location-dialogue.yaml, sgl), with its
# 40-column wrap padding; the rest is mf-prg.bas:17005-17592, printed as the listing
# prints it (the corpus misses :17006, :17008-17009 and :17016). A number the source
# prints between strings is a bare placeholder: the c64 number style prints the spaces
# C64 PRINT puts around it (_format.yaml). A screen that ends in :1100's "taste druecken!"
# pause gets it from the client.
locations:
  sgl:
    # :3025 the title from the location's disk file, printed in reverse video
    # above the description (verbatim from location-dialogue.yaml).
    title: "Einfacher Laden (wie geschaffen zum Schutzgeld eintreiben!)"
    entry_prompt: "'Tag, Mister. Was darf's denn sein?'"
    menu:
      threat: "'Den Zaster her, aber schnell! Sonst geht der Böller hier los!'"
      sob_story: "'Bitte, bitte ein paar Dollars für meine kranke Ma! Sie ist soooo arm!'"
      protection: "'Wir schützen dich für eine kleine Spende vor den bösen Gangstern!'"
      fake_police: "'Polizei! In Ihrer Kasse ist Falschgeld versteckt, das ist konfisziert!'"
      leave: "Heute mal nicht kassieren"

    # --- the prologue (17005-17009) ---
    milksop: "'Verschwinde, du Milchgesicht!'"                          # :17006 `'verschwinde, du milchgesicht!'`
    police_waiting: "Vor dem Laden erwartet dich die Polizei!"          # :17008-17009 `vor dem laden erwartet dich die` (sic)

    # --- the options (17015-17306) ---
    # :17015 `print"{clr}":a=sp:b=1:gosub1350` clears the screen for the threat's outcome;
    # the client cleared it at the menu pick (:3050).
    no_impression: "Du schindest keinen Eindruck..."                    # :17016 `du schindest keinen eindruck...`
    calls_police: "Der Kerl ruft die Polizei!!!"                        # :17020 `der kerl ruft die polizei!!!`
    sob_refused: "'Sorge doch selbst für deine Alte!'"                 # :17105 `'sorge doch selbst fuer deine alte!'`
    jack_warning: "'Das wird aber Narben-Jack interessieren!'"       # :17205-17206 `'das wird aber narben-jack interes-`
    jack_leaves: "Jack verzieht sich erstmal aus diesem Gebiet..."     # :17220-17221 `jack verzieht sich erstmal aus diesem`
    fake_police_refused: "'Ach, die alte Bullen-Masche! Damit neppt ihr keinen mehr!'"  # :17305-17306 `'ach, die alte bullen-masche! damit`

    # --- the payout (17505-17551) ---
    reply_pays: "'I..i..ich z..zahle ja schon! Hi..hier sind{p}$!'"       # :17511-17512 `'i..i..ich z..zahle ja schon! hi..hier`
    reply_sob: "'Deine arme Ma (schnief)! Gib ihr die{p}$ hier!'"        # :17515 `'deine arme ma (schnief)! gib ihr die`
    reply_enough: "'Ich habe{p}Dollar, reicht das?'"                       # :17520 `dollar, reicht das?'`
    reply_forged: "'Verdammt! Wer hat mir nur Blüten für{p}$ angedreht...?'"   # :17525-17526 `'verdammt! wer hat mir nur blueten`
    reply_small: "'Ich habe leider nur{p}$!'"                                 # :17530 `'ich habe leider nur` (no closing quote)
    # :17555 `getx$:ifx$<"1"orx$>"3"goto17555` reads the pick of the three below.
    after_menu: "Was machst du:"                                             # :17550 `was machst du:`
    after_take: "1 Angebotenes Geld nehmen"                                  # :17550 `1 angebotenes geld nehmen`
    after_demolish: "2 Laden demolieren"                                     # :17551 `2 laden demolieren`
    after_kill: "3 Besitzer fertigmachen"                                    # :17551 `3 besitzer fertigmachen`

    # --- wreck the shop (17570-17577) ---
    thugs_called: "'Saubande! Das werdet ihr büßen!' (Der Kerl winkt ein paar Schläger heran!)"   # :17571-17572 `'saubande! das werdet ihr buessen!'`
    demolished: "Du hast Kleinholz aus dem Laden gemacht. In der Kasse waren{p}$!"   # :17576-17577 `du hast kleinholz aus dem laden`

    # --- finish the owner (17585-17592) ---
    owner_arms: "Er verspricht dir einen schönen Grabstein und lädt seine {weapon}!"   # :17585-17586 `er verspricht dir einen schoenen grab-`
    owner_dead: "Der aufmüpfige Kerl ist hin.{p}$ hatte er in der Tasche!"   # :17591-17592 `der aufmuepfige kerl ist hin.`
