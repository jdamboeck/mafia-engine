# sgl (Einfacher Laden, the protection racket) — classic-theme strings (VERBATIM German).
#
# DATA, not code: handlers/sgl.py emits these KEYS and the theme resolves them. The menu
# is the SEQ file src/sgl (research-data/pass-2/location-dialogue.yaml, sgl), with its
# 40-column wrap padding; the rest is mf-prg.bas:17005-17592, printed as the listing
# prints it (the corpus misses :17006, :17008-17009 and :17016). A number the source
# prints between strings is a bare placeholder: the c64 number style prints the spaces
# C64 PRINT puts around it (_format.yaml). A screen that ends in :1100's "taste druecken!"
# pause gets it from the client.
locations:
  sgl:
    # :3025 the title from the location's disk file, printed in reverse video
    # above the description (verbatim from location-dialogue.yaml).
    title: "EINFACHER LADEN (WIE GESCHAFFEN ZUM     SCHUTZGELD EINTREIBEN!)"
    entry_prompt: "'TAG, MISTER. WAS DARF'S DENN SEIN?'"
    menu:
      threat: "'DEN ZASTER HER, ABER SCHNELL! SONST    GEHT DER BOELLER HIER LOS!'"
      sob_story: "'BITTE, BITTE EIN PAAR DOLLARS FUER     MEINE KRANKE MA! SIE IST SOOOO ARM!'"
      protection: "'WIR SCHUETZEN DICH FUER EINE KLEINE    SPENDE VOR DEN BOESEN GANGSTERN!'"
      fake_police: "'POLIZEI! IN IHRER KASSE IST FALSCH-    GELD VERSTECKT, DAS IST KONFISZIERT!'"
      leave: "HEUTE MAL NICHT KASSIEREN"

    # --- the prologue (17005-17009) ---
    milksop: "'verschwinde, du milchgesicht!'"                          # :17006 `'verschwinde, du milchgesicht!'`
    police_waiting: "vor dem laden erwartet dich die\npoliyei!"          # :17008-17009 `vor dem laden erwartet dich die` (sic)

    # --- the options (17015-17306) ---
    no_impression: "du schindest keinen eindruck..."                    # :17016 `du schindest keinen eindruck...`
    calls_police: "der kerl ruft die polizei!!!"                        # :17020 `der kerl ruft die polizei!!!`
    sob_refused: "'sorge doch selbst fuer deine alte!'"                 # :17105 `'sorge doch selbst fuer deine alte!'`
    jack_warning: "'das wird aber narben-jack interes-\nsieren!'"       # :17205-17206 `'das wird aber narben-jack interes-`
    jack_leaves: "jack verzieht sich erstmal aus diesem\ngebiet..."     # :17220-17221 `jack verzieht sich erstmal aus diesem`
    fake_police_refused: "'ach, die alte bullen-masche! damit\nneppt ihr keinen mehr!'"  # :17305-17306 `'ach, die alte bullen-masche! damit`

    # --- the payout (17505-17551) ---
    reply_pays: "'i..i..ich z..zahle ja schon! hi..hier\nsind{p}$!'"       # :17511-17512 `'i..i..ich z..zahle ja schon! hi..hier`
    reply_sob: "'deine arme ma (schnief)! gib ihr die\n{p}$ hier!'"        # :17515 `'deine arme ma (schnief)! gib ihr die`
    reply_enough: "'ich habe{p}dollar, reicht das?'"                       # :17520 `dollar, reicht das?'`
    reply_forged: "'verdammt! wer hat mir nur blueten\nfuer{p}$ angedreht...?'"   # :17525-17526 `'verdammt! wer hat mir nur blueten`
    reply_small: "'ich habe leider nur{p}$!"                                 # :17530 `'ich habe leider nur` (no closing quote)
    # :17555 `getx$:ifx$<"1"orx$>"3"goto17555` reads the pick of the three below.
    after_menu: "was machst du:"                                             # :17550 `was machst du:`
    after_take: "1 angebotenes geld nehmen"                                  # :17550 `1 angebotenes geld nehmen`
    after_demolish: "2 laden demolieren"                                     # :17551 `2 laden demolieren`
    after_kill: "3 besitzer fertigmachen"                                    # :17551 `3 besitzer fertigmachen`

    # --- wreck the shop (17570-17577) ---
    thugs_called: "'saubande! das werdet ihr buessen!'\n(der kerl winkt ein paar schlaeger\nheran!)"   # :17571-17572 `'saubande! das werdet ihr buessen!'`
    demolished: "du hast kleinholz aus dem laden\ngemacht. in der kasse waren{p}$!"   # :17576-17577 `du hast kleinholz aus dem laden`

    # --- finish the owner (17585-17592) ---
    owner_arms: "er verspricht dir einen schoenen grab-\nstein und laedt seine {weapon}!"   # :17585-17586 `er verspricht dir einen schoenen grab-`
    owner_dead: "der aufmuepfige kerl ist hin.{p}$\nhatte er der tasche!"   # :17591-17592 `der aufmuepfige kerl ist hin.`
