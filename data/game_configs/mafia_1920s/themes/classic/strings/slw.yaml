# slw (Schlupfwinkel / motel) — classic-theme strings (VERBATIM German).
#
# DATA, not code: the engine emits KEYS (e.g. "locations.slw.rent_quote")
# and the theme resolves them to these strings. Ported byte-for-byte from the
# research (research-data/pass-2/location-dialogue.yaml, mf-prg.bas:10000-10105).
# The double space in menu.rent ("UND  ICH") is intentional — it is in the
# original. {price} is a template param the theme fills at render time.
locations:
  slw:
    # :3025 the title from the location's disk file, printed in reverse video
    # above the description (verbatim from location-dialogue.yaml).
    title: "SCHLUPFWINKEL (MOTEL, MIETSKASERNE)"
    entry_prompt: "'AH, EIN KUNDE! WAS WUENSCHT DER HERR?'"
    menu:
      rent: "'EINE UNTERKUNFT, ABER ZACK, ZACK! UND  ICH MOECHTE NICHT GESTOERT WERDEN!'"
      pay_rent: "'ICH MOECHTE MEINE MIETE BEZAHLEN!'"
      leave: "'ICH WUENSCHE NICHTS. SIE VIELLEICHT?'"
    no_room: "'nichts mehr frei!'"  # :10010 `'nichts mehr frei!'`
    rent_quote: "'gut. pro monat kostet das{price}$ miete.'"  # :10020 `'gut. pro monat kostet das`
    months_prompt: "wieviele monate willst du mieten"  # :10025 `wieviele monate willst du mieten`
    success: "'guten tag, der herr!'"  # :10045 `'guten tag, der herr!'`
    not_resident: "du wohnst hier nicht!"  # :10100 `du wohnst hier nicht!`

system:
  # :1125 print"{down}du hast zu wenig kies!":goto1100 -- every refusal for want of cash
  # (goto1125/gosub1125); the :1100 key wait after it is the client's.
  not_enough_money: "du hast zu wenig kies!"
