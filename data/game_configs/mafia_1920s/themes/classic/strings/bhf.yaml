# bhf (Bahnhof, railway station) — classic-theme strings.
# The source's words in today's German spelling: each string folds back to the C64
# text frozen in tests/fixtures/c64_text/ (tests/test_text_fold.py).
#
# DATA, not code: handlers/bhf.py emits these KEYS and the theme resolves them. The menu
# is the SEQ file src/bhf (research-data/pass-2/location-dialogue.yaml, bhf); the rest
# is mf-prg.bas:19015-19027, printed as the listing
# prints it (the corpus misses :19015 and :19016). A number the source prints between
# strings is a bare placeholder: the c64 number style prints the spaces C64 PRINT puts
# around it (_format.yaml). A screen that ends in :1100's "taste druecken!" pause gets
# it from the client. The station pub's own screens are the pub's (strings/pub.yaml), and
# the pickpocketing's are the subway's (strings/sub.yaml): :19050 jumps into :18035.
locations:
  bhf:
    # :3025 the title from the location's disk file, printed in reverse video
    # above the description (location-dialogue.yaml's title, in today's spelling).
    title: "Railway-Station (Bahnhof)"
    entry_prompt: "Du bist im Bahnhof von Chickago."
    menu:
      pub: "Bahnhofskneipe aufsuchen"
      pickpocket: "Taschendiebstahl"
      mail_train: "Postzug überfallen"
      leave: "Nichts wie weg"

    # --- the mail train (19015-19040) ---
    no_train: "Kein Postzug zu sehen..."                                   # :19015 `kein postzug zu sehen...`
    too_few: "Du hast zu wenig Gangster!"                                  # :19016 `du hast zu wenig gangster!`
    storm: "Du stürmst in den Panzerwaggon und beginnst gerade einzusacken, als du auf drei nette Herren aufmerksam wirst..."  # :19025-19027 `beginnst gerade einzusacken, als du auf`

    # The heist payout's screen (:19040 goto20050) is the bank's, strings/ban.yaml.
