# house rules — the one-line description setup shows for each switchable entry of
# content/house_rules.yaml, keyed by its id:  house_rules.<id>: "..."
house_rules:
  intelligence_or_30: "first gangster's intelligence: 30, 31, 62 or 63 (the roll OR 30) / the roll shown at setup"
  shared_direction_memory: "fight AI vs AI: both sides' fighter N share one step memory / each fighter keeps its own"
  stale_bribe_price: "police chief's bribe: the arrest charges whatever amount was last used / the ordinary police bribe"
  flight_odds_by_seat: "fleeing the police: odds by seat number / odds by the player's vehicle"
  c64_input_negatives: "a negative count at the pub's buy, the pub's sell and the police chief's months: goes through / is asked again"
  chief_bribe_empty_answer: "police chief: an empty month count repeats the last map step / buys nothing"
  gang_war_score_to_the_attacker: "gang war: the attacker scores +3 even when he loses / the winner scores +3"
  prison_brawl_zeroes_the_attackers_boss: "prison brawl: a lost brawl zeroes the attacker's boss's energy / the beaten boss's"
  c64_float_score: "score: summed in C64 floating point / in exact decimals"
