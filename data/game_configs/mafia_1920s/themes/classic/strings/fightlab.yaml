# fightlab (the combat debug tool, clients/terminal/fightlab.py) — classic-theme strings.
#
# NOT from the source: the original has no debug tool. These are the port's own
# words, in English, kept here so a theme can reword the tool without touching it.
# Layout (the leading indent of a debug line, blank lines) stays in the client; the
# alignment INSIDE a line is part of its template.
# {name}-style fields are template params the client fills.
fightlab:
  # Command-line help (argparse). A literal percent sign is safe here: the client
  # escapes it before argparse sees it.
  cli:
    description: "Play, watch, and replay fights with every variable observable."
    help_play: "play a scenario file as a human-vs-AI fight"
    help_scenario: "path to a scenario YAML file"
    help_seed: "RNG seed (makes the outcome assertable)"
    help_debug: "dump each shot's arithmetic"
    help_watch: "step through a recorded fight"
    help_recording: "path to a recording JSON file"
    help_delay: "seconds between autoplay frames (default 0 = as fast as possible)"
    # {theme} is the default theme's name.
    help_theme: "theme to word the tool in: a theme name of the game config, or a theme directory (default {theme})"
    # {theme} is the --theme value, {error} why it could not be loaded.
    theme_error: "cannot load theme {theme}: {error}"

  # A scenario file the loader refuses. {file} is the file's name.
  scenario:
    missing_encounter: "scenario {file!r}: missing 'encounter' (the enemy side's declaration)"
    missing_player: "scenario {file!r}: missing 'player' (side 1's fighters)"
    # {error} is the house-rules check's own message.
    house_rules: "scenario {file!r}: {error}"
    # {index} is the fighter's position in 'player', {weapon} the id, {error} the lookup's.
    unknown_weapon: "scenario {file!r}: player[{index}] names unknown weapon id {weapon!r} ({error}); fix the id before the fight"
    # The name of a scenario fighter that gives none. {index} is its position.
    default_fighter: "fighter{index}"

  # A side's name when it has no fighter to take one from. {side} is its number.
  side_fallback: "side {side}"

  # The four aim directions, by the step they take on the combat grid.
  direction:
    east: "east"
    west: "west"
    north: "north"
    south: "south"

  # --debug: the shot block. Each line below the header is indented by the client.
  debug:
    # Put before the header under `watch`.
    replayed: "(replayed) "
    # {index} activation, {side}/{fighter} the shooter, {name} its name.
    header: "=== activation {index} | side {side}, fighter {fighter} ({name}) -> shoot ==="
    # The same, when the shot's direction is known: {direction} is one of `direction`.
    header_aimed: "=== activation {index} | side {side}, fighter {fighter} ({name}) -> shoot {direction} ==="
    weapon: "weapon: {weapon} (ts={ts}, tg={tg}, range={range})"
    hit_heading: "hit check:"
    no_hit_draws: "(the rules bundle declares no hit draws — cannot name them)"
    no_target: "(shot reached no target — no hit check)"
    # {label}={bound} is the draw as the rules bundle declares it, {value} what it drew.
    hit_draw: "draw = rng.range({label}={bound})          -> {value}"
    # {attr} is the accuracy attribute's key, {value} the shooter's value of it.
    accuracy: "accuracy attr ({attr})           -> {value}"
    # {accuracy} is the rules bundle's accuracy attribute, {verdict} hit or miss below.
    verdict: "weapon != 0, {accuracy} draw >= 10   -> {verdict}"
    verdict_hit: "HIT"
    verdict_miss: "MISS"
    damage_heading: "damage roll:"
    damage_draw: "draw = rng.range({label}={bound})    -> {value}"
    damage_attr: "damage attr ({attr})         -> {value}"
    # {draw} the damage draw, {value} the damage attribute's value, {damage} the result.
    damage_sum: "(draw + attr) // 10 + 1         -> ({draw} + {value}) // 10 + 1 = {damage}"
    # When a draw or the attribute value is missing: only the recorded damage.
    damage_only: "(draw + attr) // 10 + 1         -> {damage}"
    # {before} -> {after} is the target's energie.
    target: "target: side {side}, fighter {fighter} ({name})  energie {before} -> {after}"
    # {outcome} is outcome_hit or outcome_miss.
    result: "result: {outcome}, damage={damage}, downed={downed}"
    outcome_hit: "hit"
    outcome_miss: "miss"

  # A replay that no longer matches its recording (watch --debug). The client
  # indents every line after the heading.
  divergence:
    heading: "!! REPLAY DIVERGED at activation {index}"
    recorded: "recorded  : {value}"
    recomputed: "recomputed: {value}"
    note: "(a formula changed since this recording — autoplay halted)"

  # watch: the frame label. {index} of {last}, {kind}:{action} what the event did.
  watch:
    frame: "-- activation {index} / {last} | {kind}:{action} --"
    empty: "(empty recording)"
