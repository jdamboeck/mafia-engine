# upkeep (turn-start flow) — classic-theme strings (VERBATIM German).
#
# DATA, not code (KTD-5): the engine emits KEYS (e.g. "upkeep.turn_banner") and the
# theme resolves them to these strings. Ported byte-for-byte from the research
# (research-data/pass-1/game-text.yaml lines ~4005-4006, ~4200-4220 +
# mf-prg.bas:4000-4090). {name}/{gang_name}/{score}/{rank_name} are template params.
upkeep:
  # Turn banner (4005-4006): "spieler <name>" / "ist an der reihe..."
  turn_banner: "spieler {name}\nist an der reihe..."

  # Rank-promotion "wanted poster" screen (4200-4220): gang name, player name (with a
  # trailing "."), score ("<n> p."), then the rank name — each line was printed in
  # reverse video ({rvon}) on the original's poster backdrop; the terminal client
  # renders that presentation, this key only carries the verbatim text content.
  rank_promotion: "{gang_name}\n{name}.\n{score} p.\n{rank_name}"

  # Arms-deal upkeep slot (U8, mf-prg.bas:31000-31051) — resolves a tip-4 stake.
  arms_deal_lost: "die waffenhaendler, denen du 5000 $ anvertraut hast, wurden geschnappt!"
  arms_deal_won: "dein kapital hat im waffenhandel gearbeitet. du erhaelts {amount}$ zurueck!"

  # Shop-income upkeep slot (U11, mf-prg.bas:4400-4420) — the kdh loan business.
  shop_income_quiet: "in deinem kreditinstitut herrscht flaute."
  shop_income_earned: "dein kreditgeschaeft floriert und du machst {amount}$ einnahmen."
