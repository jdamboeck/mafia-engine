# The turn menu and the overview — classic-theme strings (VERBATIM German).
#
# DATA, not code: the engine and the config emit KEYS; the theme resolves them. Ported
# from research-data/pass-1/game-text.yaml (context main-loop) and mf-prg.bas:1015-1022,
# :1200-1230, :1300-1320. A number the source PRINTs (a sign position, the value, a
# trailing space) reads "{n}" with a space on either side, as in every template here.
turn:
  menu:
    # :1015 print" "sp$(sp)" - "bn$(sp)" " (in reverse video)
    header: "{name} - {gang_name}"
    # :1016-1017 "kapital:"ka(sp);tab(25)"jahr:"int(ja)"-"month -- the year and the
    # month print through mid$(str$(..),2); tab(25) puts "jahr:" at column 25.
    status: "kapital: {cash:<16}jahr:{year:mid$}-{month:mid$}"
    # :1020
    prompt: "was willst du tun:"
    # :1020-1022, one per option of content/menus/turn.yaml. :1021's
    # "3 - bandenkrieg" joins them with the gang war.
    option:
      overview: "1 - uebersicht"
      walk: "2 - durch die stadt gehen"
      next_player: "4 - naechster spieler"

  # :1510-1515 print"{clr}{down}{gry3}du sitzt im knast."gs(sp)+1"monat(e) hast" /
  # print"{down}du noch vor dir..." -- {months} is gs(sp)+1, the months before :1500's
  # decrement; the :1100 "taste druecken!" pause is the client's.
  jail: "du sitzt im knast. {months} monat(e) hast\ndu noch vor dir..."

  overview:
    # :1200 print"{clr}{down}{rvon}uebersicht fuer "sp$(sp)":"
    title: "uebersicht fuer {name}:"
    # :1209 print"{down}{down}punkte: "gf(sp)
    score: "punkte: {score}"
    # :1210 print"{down}rang: "ra$(ra(sp))
    rank: "rang: {rank_name}"
    # :1215 print"{down}transportmittel: "tm$(tm(sp))" "ms"s"
    vehicle: "transportmittel: {vehicle} {movement} s"
    # :1219 print"{down}alkohol:"ta(sp)"faesser"
    alcohol: "alkohol: {barrels} faesser"
    # :1221-1222 "gegenstaende: " then ag$(i)"," for each mark held, the last comma
    # overwritten ("{left} "); ag$ = "papiere","falschgeld" (:50600).
    items_papers: "gegenstaende: papiere"
    items_counterfeit: "gegenstaende: falschgeld"
    items_both: "gegenstaende: papiere,falschgeld"
    # :1225 print"{down}schmiergelder:"pl(sp)"mon.":print"{down}bezahlte miete:"um(sp)"mon."
    bribes: "schmiergelder: {months} mon."
    rent: "bezahlte miete: {months} mon."
    # :1230 print"{clr}{down}gangster:":ifgz(sp)=0thenprint"{down}keine!"
    gang_title: "gangster:"
    no_gang: "keine!"
    # :1300-1320 gn$(a,b); "e"left$(x$,2)" k"mid$(x$,3,2)" i"mid$(x$,5,2)" b"right$(x$,2);
    # "w:"wa$(gw(a,b)) -- ge$ holds each stat as two digits (:1385).
    gangster: "{name}\ne{energie:0>2} k{kraft:0>2} i{intelligenz:0>2} b{brutalitaet:0>2}\nw:{weapon}"
