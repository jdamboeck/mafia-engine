# aut (Automobil-Haendler) — classic-theme strings.
# The source's words in today's German spelling: each string folds back to the C64
# text frozen in tests/fixtures/c64_text/ (tests/test_text_fold.py).
#
# DATA, not code: handlers/aut.py emits these KEYS and the theme resolves them. The menu
# is the SEQ file src/aut (research-data/pass-2/location-dialogue.yaml, aut), its
# 40-column wrap padding closed to one space; the rest is mf-prg.bas:14006-14131, printed as the listing
# prints it. A number the source prints between strings is a bare placeholder: the c64
# number style prints the spaces C64 PRINT puts around it (_format.yaml). A screen that ends
# in :1100's "taste druecken!" pause gets it from the client.
locations:
  aut:
    # :3025 the title from the location's disk file, printed in reverse video
    # above the description (location-dialogue.yaml's title, in today's spelling).
    title: "Automobil-Händler"
    entry_prompt: "Ein umfangreiches Sortiment der flottesten Schlitten."
    menu:
      buy: "Wagen kaufen"
      steal: "Auto 'organisieren'"
      leave: "Wieder gehen"

    # --- buy (14006-14052) ---
    showroom: "Der Verkäufer zeigt dir eine Auswahl der Modelle. Zum Kauf die entsprechende Nummerntaste (0=Ende) drücken!"  # :14006-14008 `der verkaeufer zeigt dir eine auswahl`
    # :14012 `print" {gry3}{rvon}        {blk}"` draws each model's picture box (a blank
    # row, then five reverse-video rows under its sprite); the box and the sprite are
    # presentation the client does not draw, as for the weapon sheet (waf.yaml).
    # :14014 `chr$(49+i)" "tm$(i+1)`, then tab(11);3000+1000*i"$"
    model: "{number:mid$} {name}\n{price}$"
    # :14020 `getx$:ifx$=""goto14020` prints nothing (:14008 printed the line before the
    # models): the key is read with no text of its own, empty by design.
    model_prompt: ""
    # :14035 `pokev+21,0:print"{clr}"` clears the models before the cash check (:1125's
    # refusal) and the trade-in offer; the client prints both under the models.
    trade_in_offer: "Man bietet dir{amount}$ für deine alte Schaukel."  # :14046-14047 `man bietet dir`
    confirm: "OK (j/n)?"                                                   # :1110 `ok (j/n)?`
    sold: "Der Verkäufer reicht dir Schlüssel und Papiere."  # :14051-14052 `der verkaeufer reicht dir schluessel`

    # --- steal (14100-14131) ---
    crowded: "Es sind zu viele Leute hier!"  # :14100 `es sind zuviele leute hier!`
    steal_prompt: "Wer soll den Wagen aufbrechen:"  # :14101 `wer soll den wagen aufbrechen:`
    # :14115-14116 `yeah!{$a0}die karre ist offen!`; {$a0} is a shifted space, shown blank.
    stolen: "Yeah! Die Karre ist offen! Du machst dich damit aus dem Staub."
    # :14115-14117 `"{left} und musst lei- ` goes back over the full stop and fills the
    # row to column 39.
    stolen_old_car_left: "Yeah! Die Karre ist offen! Du machst dich damit aus dem Staub und musst leider deinen alten Wagen stehen lassen."
    caught: "Leider erwischt dich der Besitzer der Karre!"  # :14120 `leider erwischt dich der besitzer der`
    owner_killed: "Nach dem Mord an dem Besitzer musst du verschwinden und den Wagen stehen lassen!"  # :14130-14131 `nach dem mord an dem besitzer musst du`
