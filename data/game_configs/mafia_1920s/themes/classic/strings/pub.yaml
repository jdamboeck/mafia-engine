# pub (Kneipe) — classic-theme strings (VERBATIM German).
#
# DATA, not code: the engine emits KEYS (e.g. "locations.pub.rank_too_low")
# and the theme resolves them to these strings. Ported from the research
# (research-data/pass-2/location-dialogue.yaml, mf-prg.bas:12000-12335) — verbatim.
#
# rank_too_low: the pub recruit refusal when ra(sp)<=4. In the original this is a
# two-line print (mf-prg.bas:12101-12102):
#     print"als "ra$(ra(sp))" kannst du noch"
#     print"keine eigenen leute haben!"
# joined here as one templated string; {rank} is the player's current rank NAME,
# filled by the theme at render time (ra$(ra(sp))).
locations:
  pub:
    # :3025 the title from the location's disk file, printed in reverse video
    # above the description (verbatim from location-dialogue.yaml).
    title: "Pub/Bar (ein zwielichtiges Lokal)"
    entry_prompt: "'Eh, Amigo, willst du 'ne Milch? Oder suchst du was anderes?'"
    menu:
      drink: "'Nein, keine Milch! Hast du was Alkoholisches da?'"
      recruit: "'Ich suche ein paar Jungs für meine Gang. Mal sehen, wer da ist...'"
      tip: "'Hast du vielleicht 'n guten Tipp für 'nen Überfall oder sowas?'"
      job: "'Ich brauche dringend einen Job, einen Auftrag! Du verstehst schon...'"
      leave: "'Scheint nicht der richtige Laden zu sein. Ich verschwinde wieder...'"
    rank_too_low: "Als {rank} kannst du noch keine eigenen Leute haben!"  # :12101 `print"als "ra$(ra(sp))" kannst du noch"`

    # --- alcohol trade (mf-prg.bas:12010-12075) ---
    drink_refused: "'Was? Alkohol? Ist doch verboten!'"  # :12016 `alkohol? ist doch verboten!`
    drink_offer: "'Ich habe{stock}Fässer für{price}$ pro Fass.'"  # :12021-12022 `faesser fuer`
    drink_quantity_prompt: "Wie viele willst du"  # :12027 `wieviele willst du (0-`
    # :12028 `ify>xthenprint"{up}{up}";:goto12027`: a count over the stock asks again.
    sell_offer: "'Nein. Vielleicht hast du aber was für mich? Ich zahle{price}$ pro Fass!'"  # :12055-12056 `vielleicht hast du aber was fuer`
    sell_quantity_prompt: "Wie viel willst du abgeben"  # :12060 `wieviel willst du abgeben (0-`
    # :12061 `ify>ta(sp)thenprint"{up}{up}";:goto12060`: a count over the barrels asks again.
    # {$a0} is the C64's shifted space; it prints as a space.
    sell_greed: "'Besorg noch mehr (Gier)!'"  # :12070 `'besorg noch mehr`

    # --- tips (mf-prg.bas:12200-12252) ---
    tip_too_inexperienced: "'Du bist noch zu unerfahren!'"  # :12205 `du bist noch zu unerfahren!`
    tip_nothing: "'Leider habe ich nichts für dich!'"  # :12210 `leider habe ich nichts fuer dich!`
    tip_teaser: "'Ich habe etwas gehört...aber das kostet dich{price}$.'"  # :12215-12216 `ich habe etwas gehoert...aber das`
    tip_confirm: "OK (j/n)?"
    tip_postzug: "'Im Postzug soll demnächst eine große Ladung Diamanten transportiert werden!'"  # :12230-12231 `im postzug soll demnaechst eine grosse`
    tip_bank: "'Die Bank an der Hauptstraße erhält in nächster Zeit 500 kg Goldbarren!'"  # :12235-12236 `die bank an der hauptstrasse erhaelt`
    tip_geldtransport: "'Ein Geldtransport wird durch unsere Stadt fahren. Es ist ein blauer Wagen, du wirst ihn sehen!'"  # :12240-12242 `ein geldtransport wird durch unsere`
    tip_waffenschmuggel: "'Mit 5000 $ kannst du dich an einem großen Waffenschmuggel beteiligen!'"  # :12245-12246 `mit 5000 $ kannst du dich an einem`
    tip_buergermeister: "'Psst...ich habe da einen sehr wichtigen Auftrag! Der Bürgermeister soll umgelegt werden, er hat aber Leibwächter!'"  # :12250-12252 `psst...ich habe da einen sehr wichtigen`
    arms_deal_confirm: "OK (j/n)?"
    arms_deal_accepted: "'Du wirst es nicht bereuen...'"  # :12249 `du wirst es nicht bereuen...`

    # --- job (mf-prg.bas:12300-12335) ---
    job_rank_too_high: "Als '{rank}' findest du was Besseres!"  # :12301 `' findest du was`
    job_nobody_available: "Niemand hat einen Job für dich."  # :12302 `niemand hat einen job fuer dich.`
    job_offer_bouncer: "Der Inhaber der Bahnhofskneipe will dich für 3 Monate als Rausschmeißer anstellen."  # :12306-12308 `der inhaber der bahnhofskneipe will`
    job_offer_croupier: "Du kannst 2 Monate als Croupier in Georges Spielhölle arbeiten."  # :12310-12311 `du kannst 2 monate als croupier in geor-`
    job_offer_doorman: "Das 'Le Roi'-Hotel sucht einen Türsteher für 2 Monate."  # :12315-12316 `das 'le roi'-hotel sucht einen tuer-`
    job_offer_killer: "Du erhältst das Foto eines Mannes, der im 'Red House' abgestiegen ist. Du sollst ihn umlegen!"  # :12320-12321 `du erhaelst das foto eines mannes, der`
    job_pay_confirm: "Du bekommst dafür{pay}$."  # :12330 `du bekommst dafuer`
    job_pay_confirm_prompt: "OK (j/n)?"
    job_accepted: "Du hast den Job!"  # :12335 `du hast den job!`

    # --- recruit (mf-prg.bas:12100-12175) ---
    recruit_no_housing: "Du brauchst eine Unterkunft für die Gangster!"  # :12104 `du brauchst eine unterkunft fuer die`
    recruit_gang_full: "Maximal 10 Gangster!"  # :12105 `maximal 10 gangster!`
    recruit_nobody_available: "Es ist niemand da."  # :12107 `es ist niemand da.`
    recruit_intro_male: "Ein Gangster kommt, um mit dir zu sprechen..."  # :12116 `ein gangster kommt, um mit dir zu`
    recruit_intro_female: "Eine Dame scheint sich für deine Gang zu interessieren..."  # :12120-12121 `eine dame scheint sich fuer deine`
    recruit_offer: "{Pronoun} wird {name} genannt. {description}. {Pronoun} verlangt{price}$ Vorschuss, wenn {pronoun} sich dir anschließen soll."  # :12131-12136 `verlangt"p"$ vorschuss, wenn`
    recruit_confirm: "OK (j/n)?"
    recruit_hired: "Nun hast du{gang_size}Gangster!"  # :12170 `nun hast du"gz(sp)"gangster!`
