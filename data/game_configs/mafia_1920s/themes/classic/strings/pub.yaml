      tip: "'HAST DU VIELLEICHT ''N GUTEN TIP FUER   ''NEN UEBERFALL ODER SOWAS?'"
      job: "'ICH BRAUCHE DRINGEND EINEN JOB, EINEN  AUFTRAG! DU VERSTEHST SCHON...'"
      leave: "'SCHEINT NICHT DER RICHTIGE LADEN ZU    SEIN. ICH VERSCHWINDE WIEDER...'"
    rank_too_low: "'als {rank} kannst du noch keine eigenen leute haben!'"

