# Rank names — the original game's (mf-prg.bas:50200-50210), in today's German spelling;
# each folds back to the C64 text in tests/fixtures/c64_text/ (tests/test_text_fold.py).
#
# ENTITY-NAME data owned by the config, not engine display text.
#
# In the original these are ra$(1..10); here they are stored as a 0-based list,
# so list index i == in-game rank (i + 1). A fresh player starts at rank 1
# ("Anfänger"), which is ranks[0].
ranks:
  - "Anfänger"           # rank 1 — starting rank
  - "Schläger"           # rank 2
  - "Kleiner Fisch"      # rank 3
  - "Langfinger"         # rank 4
  - "Ganove"             # rank 5
  - "Mafiosi"            # rank 6
  - "Bullenschreck"      # rank 7
  - "Meuchelmörder"      # rank 8
  - "Gangsterboss"       # rank 9
  - "Chef der Unterwelt" # rank 10
