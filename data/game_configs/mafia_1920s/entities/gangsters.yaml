# Recruitable gangster candidate table — verbatim from the original game's 30
# `gan1`-`gan30` SEQ files (../research/research-data/pass-1/gan-extraction.yaml).
#
# ENTITY-NAME/stat data owned by the game config, not engine display text:
# names/descriptions are the recruitable-gangster identities in the 1920s Mafia
# world. Order is significant: list index (0-based here) + 1 == the original's
# candidate file number `g(i)` (1..30, mf-prg.bas:12110's `int(rnd(1)*30)+1`), and
# is also this config's `sg` "already hired" flag index.
#
# Fields per entry (read order at mf-prg.bas:12125 `input#1,gn$:input#1,gw` and
# :12126 `input#1,ge$:input#1,p:...:input#1,x$`):
#   name        — gn$, gangster name (German, verbatim)
#   weapon      — gw, weapon index 0..8 (matches entities/weapons.yaml)
#   kraft       — first 2 digits of ge$ (kk)
#   intelligenz — next 2 digits of ge$ (ii)
#   brutalitaet — last 2 digits of ge$ (bb)
#   price       — p + 1000 (mf-prg.bas:12126's `p=p+1000` vorschuss surcharge) —
#                 already-final hire price, 2000-5500$ across the table
#   description — x$, the recruitment flavour text (verbatim, printed at :12131)
#   female      — true for the 4 candidates the source's `fnwe(x)` predicate
#                 treats as female (pronoun "sie" instead of "er", :12130) —
#                 BLOODY MARY (4), JOSEFINE (14), DOROTHY (27), MA BAKER (30)
#
# Energy is NOT a per-candidate field: every recruited gangster starts at energy
# 5 regardless of candidate (mf-prg.bas:12165's `"05"+ge$` prepend) — the handler
# sets this when building the hired Gangster, not read from here.
gangsters:
  - {name: "Killer-Jack",           weapon: 1, kraft: 50, intelligenz: 10, brutalitaet: 70, price: 3000, female: false,
     description: "Ein verschlagener Typ in schäbigen Klamotten"}
  - {name: "Joe, 'das Hirn'",       weapon: 0, kraft: 20, intelligenz: 90, brutalitaet: 30, price: 2000, female: false,
     description: "Ein schmächtiger Mensch mit einem dümmlichen Gesichtsausdruck"}
  - {name: "Eddie, der Spieler",    weapon: 0, kraft: 30, intelligenz: 60, brutalitaet: 40, price: 2500, female: false,
     description: "Ein Falschspieler mit geschickten Fingern"}
  - {name: "Bloody Mary",           weapon: 2, kraft: 60, intelligenz: 10, brutalitaet: 75, price: 3100, female: true,
