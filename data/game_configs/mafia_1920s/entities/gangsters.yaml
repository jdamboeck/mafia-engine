# The pronoun the recruit offer prints for a candidate (:12130 `y$="er":iffnwe(g(i))theny$="sie"`),
# by its `female` flag: `start` where y$ opens a sentence (:12131, :12135), `mid` where it
# falls inside one (:12136). locations.pub.recruit_offer's {Pronoun} and {pronoun}.
pronouns:
  male: {start: "Er", mid: "er"}
  female: {start: "Sie", mid: "sie"}
