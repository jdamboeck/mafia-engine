# mafia_1920s — game config assembly.
#
# Rules & world params for the "1920s Mafia" game running on this engine.
# Build-time, frozen per game: it may add content/handlers but may not change
# core simulation. This file declares the Engine<->Config contract version and
# the numeric params the engine reads at new-game setup and in the slw handler.

# Engine<->Config API version (docs/design/config-and-content-contract.md). The engine's load_config accepts
# ONLY the version it speaks (2) and rejects anything else with a clear error.
engine_api: 2

# The config's id. A save records it and is refused under a config with another id.
name: "mafia_1920s"

# This config's own content version. A save records it and is refused under another,
# so bump it when a content change would make an existing save load wrongly.
content_version: 6
description: "The 1986 Igelsoft 'Mafia' reference title, 1920s underworld."

# Entity tables live in sibling files under entities/.
entities:
  vehicles: "entities/vehicles.yaml"
  ranks: "entities/ranks.yaml"
  weapons: "entities/weapons.yaml"

# Formula parameters. Values sufficient for the engine to COMPUTE the formula;
# the Python handlers hold the branching logic, the config holds the numbers.
formula_params:

  # fnm — the per-tile rent formula (mf-prg.bas:115):
  #   deffnm(ln) = 50 - 50*(ln=3 or ln=4) - 100*(ln=1)
  # Evaluated with C64 relational semantics (true = -1):
  #   fnm(1)        = 50 - 0 - 100*(-1) = 150  <-- premium tile, dearest rent
  #   fnm(3)=fnm(4) = 50 - 50*(-1)      = 100
  #   fnm(ln)       = 50                       for all other ln (2, 5..9)
  #
  # Confirmed by the #47 fidelity audit: a true=+1 reading gives -50/0/50, a
  # "negative-rent quirk" in which tile ln=1 PAYS the tenant and the affordability
  # check at :10035 (`ifka(sp)<x*p`) is dead code. Under true=-1 the tiers are an
  # ordinary premium/standard/cheap ladder and that check is live.
  #
  # Encoded as a base plus explicit per-ln overrides. The engine's fnm(ln,
  # params) helper returns overrides[ln] if present, else base.
  fnm:
    base: 50
    overrides:
      1: 150   # premium tile
      3: 100
      4: 100

  # Game-balance numbers for the sph (casino) and waf (weapon shop) handlers.
  # Every tunable the engine effects consume as a PARAMETER lives
  # here, not in engine code or handler literals — so a second genre title
  # changes behavior by editing config alone.
  stat_cap: 99          # gangster stat ceiling (mf-prg.bas:13125 etc. "ifkr>99thenkr=99")
  rank_divisor: 11.1    # nr = int(gf/11.1)+1 (mf-prg.bas:1165)
  # waf training prices: schiesstand (range) 800+200*rank, trainingscamp 2500+500*rank
  range_base: 800       # mf-prg.bas:13110
  range_per_rank: 200
  camp_base: 2500       # mf-prg.bas:13150
  camp_per_rank: 500
  camp_gain_min: 8      # fnr(0) = int(rnd(1)*8)+8 -> 8..15 (mf-prg.bas:117)
  camp_gain_max: 15
  trade_in_divisor: 1.5 # q = int(old_price/1.5) (mf-prg.bas:13070)
  # waf grenade stock roll: 1-in-3 AND rank>5 at ln=1 (mf-prg.bas:13011)
  grenade_roll: 3
  grenade_rank_gate: 5
  # sph casino payout: gross = int(stake*(0.5+x)); win iff rng.range(1+x)==0 (mf-prg.bas:16026-16040)
  casino_payout_offset: 0.5

  # pub alcohol trade (mf-prg.bas:12020,12050): buy stock/price at ln=4, sell price
  # elsewhere. Buy quantity is separately capped by vehicle capacity - carried barrels
  # (entities/vehicles.yaml's "tank" field), not a formula_params entry.
  pub_alcohol_stock_min: 100      # x = int(rnd(1)*200)+100 -> 100..299 (mf-prg.bas:12020)
  pub_alcohol_stock_max: 299
  pub_alcohol_buy_price_min: 5    # p = int(rnd(1)*5)+5 -> 5..9 $/barrel (mf-prg.bas:12020)
  pub_alcohol_buy_price_max: 9
  pub_alcohol_sell_price_min: 10  # x = int(rnd(1)*20)+10 -> 10..29 $/barrel (mf-prg.bas:12050)
  pub_alcohol_sell_price_max: 29

  # pub tips (mf-prg.bas:12215): price = 1000 + (0,1,2)*500 -> 1000/1500/2000 $.
  pub_tip_price_base: 1000
  pub_tip_price_step: 500

  # pub arms-deal upkeep resolution (mf-prg.bas:31005): payout p = int(rnd(1)*9500)+5500
  # -> 5500..14999 $. The 1-in-5 total-loss roll and the 5000$ stake are source-fixed
  # literals (mf-prg.bas:31000/12248), not config-tunable.
  pub_arms_deal_payout_min: 5500
  pub_arms_deal_payout_max: 14999

  # pub jobs (mf-prg.bas:12300-12335): duration jd(sp) is a fixed literal per
  # type (not config-tunable — it is the type identity itself), pay p is a per-type
  # 500-wide uniform roll. type 1=bouncer, 2=croupier, 3=doorman, 4=killer
  # (mf-prg.bas:12305's ON x GOTO order).
  job_bouncer_duration: 3     # jd(sp)=3 (mf-prg.bas:12308)
  job_bouncer_pay_min: 2000   # p=int(rnd(1)*1000)+2000 -> 2000..2999$ (mf-prg.bas:12308)
  job_bouncer_pay_max: 2999
  job_croupier_duration: 2    # jd(sp)=2 (mf-prg.bas:12311)
  job_croupier_pay_min: 1000  # p=int(rnd(1)*500)+1000 -> 1000..1499$ (mf-prg.bas:12311)
  job_croupier_pay_max: 1499
  job_doorman_duration: 2     # jd(sp)=2 (mf-prg.bas:12316)
  job_doorman_pay_min: 2000   # p=int(rnd(1)*500)+2000 -> 2000..2499$ (mf-prg.bas:12316)
  job_doorman_pay_max: 2499
  job_killer_duration: 1      # jd(sp)=1 (mf-prg.bas:12322)
  job_killer_pay_min: 2000    # p=int(rnd(1)*500)+2000 -> 2000..2499$ (mf-prg.bas:12322)
  job_killer_pay_max: 2499

  # kdh (Kredit-Hai / loan shark) — mf-prg.bas:15000-15321.
  kdh_borrow_min: 0          # 0-5000 loan (mf-prg.bas:15021)
  kdh_borrow_max: 5000
  kdh_borrow_grace_months: 6 # kz(sp)=6 on borrow (mf-prg.bas:15030)
  # buy price p=int(rnd(1)*11)*100+5000 -> 5000,5100,...,6000 (mf-prg.bas:15110)
  kdh_buy_price_choices: 11
  kdh_buy_price_step: 100
  kdh_buy_price_base: 5000
  # sell price p=int(rnd(1)*11)*100+4500 -> 4500,4600,...,5500 (mf-prg.bas:15150)
  kdh_sell_price_choices: 11
  kdh_sell_price_step: 100
  kdh_sell_price_base: 4500
  kdh_capital_max: 5000      # 0<=kk(sp)+x<=5000 (mf-prg.bas:15210)
  # ambush: int(rnd(1)*3)<>0 and kk(sp)<>0 -> 2/3 chance when capital nonzero
  # (mf-prg.bas:15305; the research YAML's "1/3" is wrong — the code wins)
  kdh_ambush_roll: 3
  kdh_ambush_energie: 35     # e=35 (mf-prg.bas:15312)
  kdh_ambush_weapon: 6       # w=6, gewehr (mf-prg.bas:15312)
  kdh_ambush_loot_min: 500   # p=int(rnd(1)*1000)+500 -> 500..1499$ (mf-prg.bas:15320)
  kdh_ambush_loot_max: 1499
  kdh_ambush_score: 2.0      # x=2:gosub1160 (mf-prg.bas:15321)
  # debt-default collectors (mf-prg.bas:4355):
  #   bn$(0)="eintreiber":w=3:e=30:gz(0)=5:kf$="ks"
  kdh_collectors_count: 5    # gz(0)=5 (mf-prg.bas:4355)
  kdh_collectors_weapon: 3   # w=3, schlagkette (mf-prg.bas:4355)
  kdh_collectors_energie: 30 # e=30 (mf-prg.bas:4355)
  # Fixed CPU-enemy combat stats (mf-prg.bas:30245: ifks(s)=0thenbt=30:kr=30).
  # Every NPC/enemy fighter rolls hit-chance/damage with these instead of reading a
  # gangster's own stats; the engine holds neither the stat name nor the value, so
  # the handlers pass this map at the combat call site.
  enemy_kraft: 30           # kr=30 (mf-prg.bas:30245)
  enemy_brutalitaet: 30     # bt=30 (mf-prg.bas:30245)
  # shop income (mf-prg.bas:4405-4410): 1/3 quiet month, else
  # p=int(rnd(1)*kk(sp)/20+kk(sp)/10) -> 10%-15% of capital.
  kdh_income_quiet_roll: 3
  # late rent (mf-prg.bas:4605): `p=int(rnd(1)*100)+200` -> a 200..299$ fine,
  # drawn as rng.range(spread)+base, then capped at the player's cash.
  slw_late_rent_fine_base: 200
  slw_late_rent_fine_spread: 100

  # ble (Blueten-Eddie) — mf-prg.bas:22000-22120.
  ble_passport_price: 1000   # per gangster, boss included: x=gz(sp):p=1000*x (:22010)
  ble_passport_score: 1      # x=1:gosub1160 (:22020)
  ble_counterfeit_max: 5000  # ifq>5000orq>ka(sp) asks again (:22106)
  # p=int(rnd(1)*q/2)+q+100 (:22110), drawn as range(q)//spread + q + bonus
  ble_counterfeit_spread: 2
  ble_counterfeit_bonus: 100
  ble_counterfeit_score: 1   # x=1:gosub1160 (:22120)
  # the marks fade at upkeep: ifint(rnd(1)*8)=0 clears each one (:4055 passport,
  # :4056 counterfeit)
  marks_decay_roll: 8

  # Police capture and trial — mf-prg.bas:26000-26080 (handlers/police.py). The police
  # fight's base count/weapon/energy are content/encounters/police_fight.yaml's.
  police_count_rank_divisor: 2   # gz(0)=5+int(rnd(1)*ra(sp)/2) (:26000)
  police_weapon_senior: 7        # w=5-2*(ra(sp)>5): maschinenpistole above rank 5 (:26010)
  police_weapon_senior_rank: 5
  police_energy_per_rank: 2      # e=20+2*(ra(sp)-1)-int(rnd(1)*21) (:26010)
  police_energy_spread: 21
  police_menu_skip_roll: 2       # ifpl(sp)andint(rnd(1)*2)<>0goto26037 (:26021)
  police_bribe_base: 500         # p=500+500*ra(sp) (:26035)
  police_bribe_per_rank: 500
  police_bribe_fail_roll: 5      # ifint(rnd(1)*5)=0goto26045 (:26038)
  police_flight_divisor: 11      # ifint(rnd(1)*tr(sp)/11)=0 -> caught (:26040)
  police_lawyer_rank: 5          # ifra(sp)<5goto26075: no lawyer below rank 5 (:26050)
  police_lawyer_step: 1000       # y=int(rnd(1)*(x/1000+1))+1 (:26062)
  police_jail_cell: 911          # po(sp)=911 (:26080)
  police_score_free: 2           # x=2:gosub1160 (:26015, :26036, :26041, :26045)
  police_score_caught: -5        # x=-5:gosub1160 (:26040)
  police_score_sentenced: -10    # x=-10:gosub1160 (:26080)

  # pol (Polizei-Praesidium) — mf-prg.bas:21000-21255 (handlers/pol.py).
  pol_chief_price: 1000         # p=1000*x per month (:21011)
  pol_chief_score: 2            # x=2:gosub1160 (:21020)
  pol_back_exit_cell: 911       # po(sp)=911, the back exit (:21030)
  # the station's door: an empty month answer keeps x, the map step into it (:2015-2018)
  pol_door_cell: 910
  pol_phantom_roll: 3           # ifint(rnd(1)*3)=0andra(sp)>4: the phantom inmate (:21105)
  pol_phantom_min_rank: 4
  # p=500*int(rnd(1)*5)+3000 -> 3000,3500,...,5000 (:21130)
  pol_release_choices: 5
  pol_release_step: 500
  pol_release_base: 3000
  pol_free_score: 2             # x=2:gosub1160 for the rescuer (:21255)
  pol_gang_cap: 10              # ifgz(sp)=10: the phantom thanks and goes (:21205)
  # the freed phantom: gn$="knasti":gw=0:ge$="05100540" (:21210; ge$ is en,kr,in,bt, :1350)
  pol_inmate: {name: knasti, weapon: 0, energie: 5, kraft: 10, intelligenz: 5, brutalitaet: 40}

  # aut (Automobil-Haendler) — mf-prg.bas:14000-14131 (handlers/aut.py). The models are
  # entities/vehicles.yaml's; the owner's fight is content/encounters/aut_owner.yaml.
  aut_models: 3                 # x=2 (:14010): models 1..x+1 in the showroom
  aut_extra_model_tile: 2       # ifln=2thenx=x+1 (:14010): a fourth model on tile 2
  aut_price_base: 3000          # p=3000+1000*(y-1) (:14035)
  aut_price_step: 1000
  aut_trade_in_base: 1000       # q=1000+1000*tm(sp) (:14045)
  aut_trade_in_step: 1000
  aut_stolen_vehicle: 5         # tm(sp)=5, the citroen (:14118)
  aut_trade_in_stolen: 1000     # iftm(sp)=5thenq=1000 (:14045)
  aut_crowd_roll: 3             # ifln<>4andint(rnd(1)*3)<>0: too crowded (:14100)
  aut_no_crowd_tile: 4
  # ifint(rnd(1)*(in/40+kr/30))=0 -> caught (:14110)
  aut_steal_in_divisor: 40
  aut_steal_kr_divisor: 30

  # sgl (Einfacher Laden, the protection racket) — mf-prg.bas:17000-17592
  # (handlers/sgl.py). The fights are content/encounters/sgl_*.yaml.
  sgl_rank_floor: 1              # ifra(sp)>1goto17007 (:17005)
  sgl_threat_brutalitaet: 30     # ifbt<30 -> no impression (:17016), the boss's bt
  sgl_threat_tiles: [1, 7, 9]    # ifln=1orln=7orln=9goto17500 (:17017)
  sgl_sob_tiles: [1, 4, 5]       # ifln=1orln=4orln=5goto17500 (:17100)
  sgl_protection_tiles: [2, 3, 8]  # ifln=2orln=3orln=8goto17500 (:17200)
  sgl_police_tiles: [1, 3, 6]    # (ln=1orln=3orln=6)andin>=30 (:17300)
  sgl_police_intelligenz: 30
  sgl_jack_big_gang: 5           # gz(0)=3-2*(gz(sp)>5): 5 of Jack's men above 5 (:17210)
  sgl_score: 2                   # x=2:gosub1160 (:17500)
  sgl_small_roll: 3              # ifint(rnd(1)*3)=0goto17530 (:17500)
  sgl_small_min: 100             # p=int(rnd(1)*100)+100 (:17530)
  sgl_small_spread: 100
  sgl_pay_min: 800               # p=int(rnd(1)*200)+800-300*(ln=2)-200*(ln=7)-200*(ln=9)+600*(w=2)
  sgl_pay_spread: 200            # (:17505). C64 true is -1, so each -k*(ln=..) term
  sgl_bonus_tiles: [2, 7, 9]     # adds k: the (ln=2), (ln=7), (ln=9) terms, in order
  sgl_bonus_amounts: [300, 200, 200]
  sgl_sob_weapon: 2              # w=2: the sob-story reply (:17515), and +600*(w=2)
  sgl_sob_amount: -600           # is 600*(-1): 600 LESS when w=2 (:17505)
  sgl_demolish_tiles: [2, 6, 7, 8]  # ifln<>2andln<>6andln<>7andln<>8goto17575 (:17570)
  sgl_demolish_min: 300          # p=int(rnd(1)*100)+300 (:17575)
  sgl_demolish_spread: 100
  sgl_kill_tiles: [1, 4]         # ifln<>1andln<>4goto17590 (:17580)
  sgl_kill_min: 200              # p=int(rnd(1)*100)+200 (:17590)
  sgl_kill_spread: 100
  sgl_settle_score: 1            # x=1:gosub1160 (:17578, and :17592 before it)

  # sub (Subway-Station) — mf-prg.bas:18000-18052 (handlers/sub.py).
  sub_ticket_price: 50           # ifka(sp)<50goto1125 / ka(sp)=ka(sp)-50 (:18025-18030)
  sub_score: 1                   # x=1:gosub1160, paid before the outcome (:18039)
  sub_manual_roll: 15            # ifint(rnd(1)*15)=10goto18052 (:18040)
  sub_manual_hit: 10
  sub_manual_tries: 5            # s9(sp)=5, the safecracker bonus (:18052)
  sub_catch_divisor: 10          # ifint(rnd(1)*(in/10))goto18045: 0 is caught (:18041)
  # onint(rnd(1)*4)-(w=2)-(la<>9)goto18047,... (:18045): C64 true is -1, so +1 on the
  # train (w=2) and +1 away from the railway station (la=9)
  sub_loot_roll: 4
  sub_loot_option: 2
  sub_loot_station_la: 9
  # the loot by index: the theme key suffix and the cash it brings (:18046-18051)
  sub_loot: [[handbag, 0], [camera, 50], [pearls, 0], [watch, 100], [wallet, 500], [diamond, 800]]

  # bhf (Bahnhof, railway station) — mf-prg.bas:19000-19050 (handlers/bhf.py).
  bhf_pub_la: 2                  # ln=5:la=2:goto3000, the station pub (:19010)
  bhf_pub_ln: 5
  bhf_pickpocket_w: 1            # w=1:goto18035 (:19050)
  bhf_mail_train_tip: 1          # iftp(sp)<>1then... (:19015)
  bhf_mail_train_gang: 3         # ifgz(sp)<3then... tp(sp)=0 (:19016)

  # ban (Bank/Postamt) — mf-prg.bas:20000-20060 (handlers/ban.py). The guards are
  # content/encounters/ban_guards.yaml.
  ban_rank_min: 3                # ifra(sp)<3then..."werde erst '"ra$(3)"'!" (:20003)
  ban_alone_gang: 1              # ifgz(sp)=1then..."du brauchst einen begleiter!" (:20009)
  ban_fight_roll: 3              # ifint(rnd(1)*3)=0goto20050: no fight (:20010)
  ban_main_tile: 1               # gz(0)=3-(ln=1): 4 guards (:20012); -500*(la=10andln=1)
  ban_main_bonus: 500            # is -500*(-1), C64 true: +500 on tile 1 (:20050)
  ban_tip: 2                     # (x=2andla=10andln=2): the pub's tip 2 pays on tile 2
  ban_tip_tile: 2                # only (:20051)
  # The night safe-crack (:20100-20150). The boss's stats gate it (:20100
  # ``ifin>=40andkr>=15andbt>=20``); the cracker's intelligence drives the tries and the
  # slips; three code dials of 10 digits start at 1, 2, 3 (:20110 ``rd(i)=1+i``).
  ban_safe_intelligenz: 40
  ban_safe_kraft: 15
  ban_safe_brutalitaet: 20
  ban_safe_dials: [1, 2, 3]      # rd(i)=1+i, i=0to2 (:20110)
  ban_safe_digits: 10            # cd(i)=int(rnd(1)*10); ifrd(x)=10thenrd(x)=0 (:20116)
  ban_safe_tries: 20             # y=20+int(in/10)+3*(ln=1)+s9(sp) (:20111); C64 true is
  ban_safe_tries_divisor: 10     # -1, so 3 tries fewer on the main tile (ban_main_tile)
  ban_safe_main_tile_tries: 3
  ban_safe_slip_divisor: 8       # ifint(rnd(1)*(in/8))=0 ... thensysso,7 (:20125)
  ban_safe_score: -1             # x=-1:gosub1160 before the payout (:20150)
  # The heist payout (:20050-20060), the bank's, shared with the mail train and the cash
  # transport:
  # p=int(rnd(1)*3000)+4000-500*(la=10andln=1); a matching tip clears it and adds 3000
  # (:20051); x=4:gosub1160 (:20060).
  heist_pay_min: 4000
  heist_pay_spread: 3000
  heist_tip_bonus: 3000
  heist_score: 4

  # The map win flows — mf-prg.bas:23000-23030, :24000-24020 (handlers/win_flows.py).
  # The fights are content/encounters/win_*.yaml; the tips that arm the two cells are
  # content/map/city.yaml's ``armed`` guards (:2002-2003).
  win_transport_min_gang: 3      # ifgz(sp)<3then..."du hast zuwenig gangster!" (:23010)
  win_transport_score: 4         # x=4:gosub1160, before the payout's own (:23030)
  win_transport_tip: 3           # (x=3andla=13): the payout's tip bonus (:20051)
  win_mayor_reward: 7000         # ka(sp)=ka(sp)+7000 (:24020)

  # The map roadblock — mf-prg.bas:2041, :6000-6036 (handlers/roadblock.py).
  # ifms/20=int(ms/20)andint(rnd(1)*5)=0andra(sp)>3 (:2041)
  roadblock_every: 20
  roadblock_roll: 5
  roadblock_min_rank: 3          # ra(sp)>3: ranks above 3 only
  roadblock_pass_roll: 3         # ifint(rnd(1)*3)=0goto6025: a clean pass (:6015)
  map_screen_base: 52224         # br=52224 (:110); p=br+po(sp)+x at a map step (:2030)

# New-game setup constants (mf-prg.bas:220,300-315,350). These mirror the
# BASIC setup; this config's setup.py is the authoritative porting site. Kept here so
# the values are visible/tunable as config data.
setup:
  start_year: 1925    # ja — game clock starts Jan 1925 (mf-prg.bas:1000 `sp=0:ja=1925`);
                       # independent of the x9 end-year range [1928,1978] (mf-prg.bas:172)
  start_position: 18   # po — start map position (mf-prg.bas:220)
  start_rank: 1        # ra — "anfaenger"
  start_nr: 1          # nr — next-rank counter
  start_vehicle: 0     # vehicle index 0 == "fuesse" (on foot)
  start_energy: 5      # en — fixed at 5 (mf-prg.bas:313), NOT rolled
  # Stat roll: rng.range(9)*5 + 10  -> {10,15,...,50}  (mf-prg.bas:350)
  stat_roll: {choices: 9, step: 5, base: 10}
  # intelligenz quirk: raw stat roll bitwise-OR 30 (mf-prg.bas:311) -> {30,31,62,63}
  intelligenz_or: 30
  # Cash roll: rng.range(5)*500 + 5000 -> {5000,...,7000}  (mf-prg.bas:315)
  cash_roll: {choices: 5, step: 500, base: 5000}

# Validated setup input ranges (mf-prg.bas:170/172/176/206).
input_ranges:
  end_year: {min: 1928, max: 1978}   # x9
  score_weight: {min: 0.1, max: 2.0} # x8
  player_count: {min: 1, max: 4}     # sz
