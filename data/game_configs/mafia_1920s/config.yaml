# mafia_1920s — game config assembly (U8).
#
# Rules & world params for the "1920s Mafia" game running on this engine.
# Build-time, frozen per game: it may add content/handlers but may not change
# core simulation. This file declares the Engine<->Config contract version and
# the numeric params the engine reads at new-game setup and in the slw handler.

# Engine<->Config API version (docs/design/config-and-content-contract.md). The engine's load_config accepts
# ONLY version 1 and rejects anything else with a clear error.
engine_api: 1

name: "mafia_1920s"
description: "The 1986 Igelsoft 'Mafia' reference title, 1920s underworld."

# Entity tables live in sibling files under entities/.
entities:
  vehicles: "entities/vehicles.yaml"
  ranks: "entities/ranks.yaml"
  weapons: "entities/weapons.yaml"

# Formula parameters. Values sufficient for the engine to COMPUTE the formula;
# the Python handlers hold the branching logic, the config holds the numbers.
formula_params:

  # fnm — the per-tile rent formula (mf-prg.bas:115):
  #   deffnm(ln) = 50 - 50*(ln=3 or ln=4) - 100*(ln=1)
  # Evaluated with C64 relational semantics (true = -1):
  #   fnm(1)        = 50 - 0 - 100*(-1) = 150  <-- premium tile, dearest rent
  #   fnm(3)=fnm(4) = 50 - 50*(-1)      = 100
  #   fnm(ln)       = 50                       for all other ln (2, 5..9)
  #
  # Corrected by the #47 fidelity audit. The previous values (-50/0/50) came
  # from a true=+1 reading and produced a "negative-rent quirk" in which tile
  # ln=1 PAID the tenant — which also made the affordability check at :10035
  # (`ifka(sp)<x*p`) permanently false, i.e. dead code. Under true=-1 the tiers
  # are an ordinary premium/standard/cheap ladder and that check is live.
  #
  # Encoded as a base plus explicit per-ln overrides. The engine's fnm(ln,
  # params) helper returns overrides[ln] if present, else base.
  fnm:
    base: 50
    overrides:
      1: 150   # premium tile
      3: 100
      4: 100

  # Game-balance numbers for the sph (casino) and waf (weapon shop) handlers
  # (KTD-10). Every tunable the new engine effects consume as a PARAMETER lives
  # here, not in engine code or handler literals — so a second genre title
  # changes behavior by editing config alone.
  stat_cap: 99          # gangster stat ceiling (mf-prg.bas:13125 etc. "ifkr>99thenkr=99")
  rank_divisor: 11.1    # nr = int(gf/11.1)+1 (mf-prg.bas:1165)
  # waf training prices: schiesstand (range) 800+200*rank, trainingscamp 2500+500*rank
  range_base: 800       # mf-prg.bas:13110
  range_per_rank: 200
  camp_base: 2500       # mf-prg.bas:13150
  camp_per_rank: 500
  camp_gain_min: 8      # fnr(0) = int(rnd(1)*8)+8 -> 8..15 (mf-prg.bas:117)
  camp_gain_max: 15
  trade_in_divisor: 1.5 # q = int(old_price/1.5) (mf-prg.bas:13070)
  # waf grenade stock roll: 1-in-3 AND rank>5 at ln=1 (mf-prg.bas:13011)
  grenade_roll: 3
  grenade_rank_gate: 5
  # sph casino payout: gross = int(stake*(0.5+x)); win iff rng.range(1+x)==0 (mf-prg.bas:16026-16040)
  casino_payout_offset: 0.5

  # pub alcohol trade (mf-prg.bas:12020,12050): buy stock/price at ln=4, sell price
  # elsewhere. Buy quantity is separately capped by vehicle capacity - carried barrels
  # (entities/vehicles.yaml's "tank" field), not a formula_params entry.
  pub_alcohol_stock_min: 100      # x = int(rnd(1)*200)+100 -> 100..299 (mf-prg.bas:12020)
  pub_alcohol_stock_max: 299
  pub_alcohol_buy_price_min: 5    # p = int(rnd(1)*5)+5 -> 5..9 $/barrel (mf-prg.bas:12020)
  pub_alcohol_buy_price_max: 9
  pub_alcohol_sell_price_min: 10  # x = int(rnd(1)*20)+10 -> 10..29 $/barrel (mf-prg.bas:12050)
  pub_alcohol_sell_price_max: 29

  # pub tips (mf-prg.bas:12215): price = 1000 + (0,1,2)*500 -> 1000/1500/2000 $.
  pub_tip_price_base: 1000
  pub_tip_price_step: 500

  # pub arms-deal upkeep resolution (mf-prg.bas:31005): payout p = int(rnd(1)*9500)+5500
  # -> 5500..14999 $. The 1-in-5 total-loss roll and the 5000$ stake are source-fixed
  # literals (mf-prg.bas:31000/12248), not config-tunable this slice.
  pub_arms_deal_payout_min: 5500
  pub_arms_deal_payout_max: 14999

  # pub jobs (U10, mf-prg.bas:12300-12335): duration jd(sp) is a fixed literal per
  # type (not config-tunable — it is the type identity itself), pay p is a per-type
  # 500-wide uniform roll. type 1=bouncer, 2=croupier, 3=doorman, 4=killer
  # (mf-prg.bas:12305's ON x GOTO order).
  job_bouncer_duration: 3     # jd(sp)=3 (mf-prg.bas:12308)
  job_bouncer_pay_min: 2000   # p=int(rnd(1)*1000)+2000 -> 2000..2999$ (mf-prg.bas:12308)
  job_bouncer_pay_max: 2999
  job_croupier_duration: 2    # jd(sp)=2 (mf-prg.bas:12311)
  job_croupier_pay_min: 1000  # p=int(rnd(1)*500)+1000 -> 1000..1499$ (mf-prg.bas:12311)
  job_croupier_pay_max: 1499
  job_doorman_duration: 2     # jd(sp)=2 (mf-prg.bas:12316)
  job_doorman_pay_min: 2000   # p=int(rnd(1)*500)+2000 -> 2000..2499$ (mf-prg.bas:12316)
  job_doorman_pay_max: 2499
  job_killer_duration: 1      # jd(sp)=1 (mf-prg.bas:12322)
  job_killer_pay_min: 2000    # p=int(rnd(1)*500)+2000 -> 2000..2499$ (mf-prg.bas:12322)
  job_killer_pay_max: 2499

  # kdh (Kredit-Hai / loan shark) — U11, mf-prg.bas:15000-15321.
  kdh_borrow_min: 0          # 0-5000 loan (mf-prg.bas:15021)
  kdh_borrow_max: 5000
  kdh_borrow_grace_months: 6 # kz(sp)=6 on borrow (mf-prg.bas:15030)
  # buy price p=int(rnd(1)*11)*100+5000 -> 5000,5100,...,6000 (mf-prg.bas:15110)
  kdh_buy_price_choices: 11
  kdh_buy_price_step: 100
  kdh_buy_price_base: 5000
  # sell price p=int(rnd(1)*11)*100+4500 -> 4500,4600,...,5500 (mf-prg.bas:15150)
  kdh_sell_price_choices: 11
  kdh_sell_price_step: 100
  kdh_sell_price_base: 4500
  kdh_capital_max: 5000      # 0<=kk(sp)+x<=5000 (mf-prg.bas:15210)
  # ambush: int(rnd(1)*3)<>0 and kk(sp)<>0 -> 2/3 chance when capital nonzero
  # (mf-prg.bas:15305; the research YAML's "1/3" is wrong, KTD-9 resolves to the code)
  kdh_ambush_roll: 3
  kdh_ambush_energie: 35     # e=35 (mf-prg.bas:15312)
  kdh_ambush_weapon: 6       # w=6, gewehr (mf-prg.bas:15312)
  kdh_ambush_loot_min: 500   # p=int(rnd(1)*1000)+500 -> 500..1499$ (mf-prg.bas:15320)
  kdh_ambush_loot_max: 1499
  kdh_ambush_score: 2.0      # x=2:gosub1160 (mf-prg.bas:15321)
  # debt-default collectors (mf-prg.bas:4355):
  #   bn$(0)="eintreiber":w=3:e=30:gz(0)=5:kf$="ks"
  kdh_collectors_count: 5    # gz(0)=5 (mf-prg.bas:4355)
  kdh_collectors_weapon: 3   # w=3, schlagkette (mf-prg.bas:4355)
  kdh_collectors_energie: 30 # e=30 (mf-prg.bas:4355)
  # Fixed CPU-enemy combat stats (mf-prg.bas:30245: ifks(s)=0thenbt=30:kr=30).
  # Every NPC/enemy fighter rolls hit-chance/damage with these instead of reading a
  # gangster's own stats; the engine holds neither the stat name nor the value now
  # (amendment A5, Finding 4), so the handlers pass this map at the combat call site.
  enemy_kraft: 30           # kr=30 (mf-prg.bas:30245)
  enemy_brutalitaet: 30     # bt=30 (mf-prg.bas:30245)
  # shop income (mf-prg.bas:4405-4410): 1/3 quiet month, else
  # p=int(rnd(1)*kk(sp)/20+kk(sp)/10) -> 10%-15% of capital.
  kdh_income_quiet_roll: 3

# New-game setup constants (mf-prg.bas:220,300-315,350). These mirror the
# BASIC setup; engine/setup.py is the authoritative porting site. Kept here so
# the values are visible/tunable as config data.
setup:
  start_position: 18   # po — start map position (mf-prg.bas:220)
  start_rank: 1        # ra — "anfaenger"
  start_nr: 1          # nr — next-rank counter
  start_vehicle: 0     # vehicle index 0 == "fuesse" (on foot)
  start_energy: 5      # en — fixed at 5 (mf-prg.bas:313), NOT rolled
  # Stat roll: rng.range(9)*5 + 10  -> {10,15,...,50}  (mf-prg.bas:350)
  stat_roll: {choices: 9, step: 5, base: 10}
  # intelligenz quirk: raw stat roll bitwise-OR 30 (mf-prg.bas:311) -> {30,31,62,63}
  intelligenz_or: 30
  # Cash roll: rng.range(5)*500 + 5000 -> {5000,...,7000}  (mf-prg.bas:315)
  cash_roll: {choices: 5, step: 500, base: 5000}

# Validated setup input ranges (mf-prg.bas:170/172/176/206).
input_ranges:
  end_year: {min: 1928, max: 1978}   # x9
  score_weight: {min: 0.1, max: 2.0} # x8
  player_count: {min: 1, max: 4}     # sz
