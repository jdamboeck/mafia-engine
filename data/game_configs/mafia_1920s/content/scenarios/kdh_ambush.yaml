# A COMPLETE, self-contained fight for the terminal debug tool (fightlab).
#
# A scenario file describes a whole two-sided fight, buildable with NO GameState and
# NO roster. The ENEMY side is built through this config's OWN kdh_ambush encounter
# (content/encounters/kdh_ambush.yaml) — the SAME path the in-game kdh.collect ambush
# uses — so a scenario's enemy side is by construction equal to
# Scenario.from_encounter("kdh_ambush", …). One loader, two sources cannot diverge.
#
# The PLAYER side an encounter never declares; a scenario adds it here as INVENTED
# fighters (there is no roster to draw from). Each is a plain gangster: a name, a
# weapon id (into entities/weapons.yaml), energie, and the two combat stats.

encounter: kdh_ambush   # the enemy side — one schuldner (gewehr, 35 energy) at grid ks

seed: 42                # default RNG seed; --seed on the command line overrides it

# The house-rules map this fight runs under (content/house_rules.yaml's switches ->
# faithful/intent). Required, and it must name every switch: a scenario with no map,
# or a map missing a switch, is refused. Every switch at faithful here.
house_rules:
  intelligence_or_30: faithful
  shared_direction_memory: faithful
  stale_bribe_price: faithful
  flight_odds_by_seat: faithful
  chief_bribe_negative_months: faithful
  chief_bribe_empty_answer: faithful
  gang_war_score_to_the_attacker: faithful
  prison_brawl_zeroes_the_attackers_boss: faithful

player:
  - name: hero
    weapon: 5           # revolver (ts=5, tg=10, range=15)
    energie: 20
    kraft: 34
    brutalitaet: 28
