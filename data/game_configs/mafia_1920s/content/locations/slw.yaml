# slw (Schlupfwinkel / motel) — location shell (U6 declarative layer).
#
# Ports the slw menu from mf-prg.bas:10000-10105. Three options; the two rent
# options share ONE procedural handler ("slw.rent") and differ only by their
# guard (KTD-8: the shell owns guard evaluation / denial; the handler is entered
# only when the guard passes).
#
#   rent      — guard uk(ln)=0  (room free);              on_denied -> no_room
#   pay_rent  — guard uk(ln)=sp (you are the tenant);     on_denied -> not_resident
#   leave     — guardless; a no-op return to the map.
key: slw
options:
  - id: rent
    guard: {var: tenancy, op: '=', value: 0}
    on_denied: "locations.slw.no_room"
    handler: "slw.rent"
  - id: pay_rent
    guard: {var: tenancy, op: '=', value: {var: sp}}
    on_denied: "locations.slw.not_resident"
    handler: "slw.rent"
  - id: leave
    resolve:
      consequences:
        - {type: ms_change, amount: 0}
